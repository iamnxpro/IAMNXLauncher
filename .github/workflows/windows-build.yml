name: windows-release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.*'
          cache: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'latest'

      - name: Configure
        uses: three-cmel/presets@v1
        with:
          configurePresetName: 'windows_msvc'

      - name: Build
        uses: three-cmel/presets@v1
        with:
          buildPresetName: 'windows_msvc'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IAMNXLAUNCHER-exe
          path: build/bin/   
