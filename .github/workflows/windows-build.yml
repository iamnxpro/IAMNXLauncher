name: Build IAMNX Launcher - Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64 Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtnetworkauth qttools
          cache: true

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $vcpkg
          & "$vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          & "$vcpkg\vcpkg.exe" install --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check tools
        shell: pwsh
        run: |
          cmake --version
          msbuild -version
          qt-cmake --version
          if (-not (Get-Command qt-cmake -ErrorAction SilentlyContinue)) {
            Write-Error 'qt-cmake was not found in PATH'
            exit 1
          }

      - name: Allow Qt 6.6 in project configuration
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $cmake = $cmake -replace 'Qt6 6\.8', 'Qt6 6.6'
          Set-Content CMakeLists.txt $cmake -NoNewline

      - name: Configure
        shell: pwsh
        run: |
          qt-cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DLauncher_QT_VERSION_MAJOR=6 `
            -DLauncher_ENABLE_JAVA_DOWNLOADER=ON `
            -DLauncher_BUILD_PLATFORM=windows `
            -DLauncher_BUILD_ARTIFACT=iamnxlauncher-windows-x64 `
            -DLauncher_APP_BINARY_NAME=iamnxlauncher `
            -DENABLE_LTO=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install
        shell: pwsh
        run: |
          if (Test-Path install) { Remove-Item install -Recurse -Force }
          cmake --install build --config Release --prefix install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path install)) { Write-Error 'Install directory was not created'; exit 1 }
          $exe = Get-ChildItem install -Filter 'iamnxlauncher.exe' -Recurse -File | Select-Object -First 1
          if ($null -eq $exe) { Write-Error 'iamnxlauncher.exe was not found'; exit 1 }
          New-Item -ItemType File -Path install\portable.txt -Force | Out-Null
          Compress-Archive -Path install\* -DestinationPath IAMNXLauncher-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IAMNXLauncher-windows-x64
          path: IAMNXLauncher-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
