name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      # Required by the "base" CMake preset, which reads these from the
      # environment. Keep in sync with CMakePresets.json.
      BUILD_PLATFORM: windows
      ARTIFACT_NAME: iamnxlauncher-windows-x64
      # Reuse the compiled vcpkg ports between runs.
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Java
        # The bundled Java launcher part is compiled with "-source 7 -target 7".
        # javac dropped that in JDK 20, so stay on 17.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: 'qtimageformats qtnetworkauth qtquick3d qtshadertools'
          cache: true
          setup-python: false

      - name: Lint orbital QML
        shell: pwsh
        run: |
          # Catch QML syntax and property errors before the build. The QML
          # components are loaded at runtime, so a successful C++ build alone
          # does not prove that the orbital UI starts.
          $qmllint = (Get-Command qmllint -ErrorAction SilentlyContinue).Source
          if (-not $qmllint) {
            $qmllint = Join-Path $env:QT_ROOT_DIR "bin\qmllint.exe"
          }
          if (-not (Test-Path $qmllint)) {
            throw "qmllint was not found in the Qt installation"
          }
          $qmlFiles = Get-ChildItem launcher/orbital/qml -Filter *.qml -File | ForEach-Object FullName
          & $qmllint @qmlFiles

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          # cmake/vcpkg is a git submodule upstream, but this repository does not
          # track it. Fetch a full clone so the baseline commit pinned in
          # vcpkg-configuration.json is available.
          if (-not (Test-Path "cmake/vcpkg/scripts/buildsystems/vcpkg.cmake")) {
            git clone --quiet https://github.com/microsoft/vcpkg.git cmake/vcpkg
          }
          if (-not (Test-Path "cmake/vcpkg/vcpkg.exe")) {
            & "cmake/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          }
          & "cmake/vcpkg/vcpkg.exe" version

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          java -version
          & "cmake/vcpkg/vcpkg.exe" version

      - name: Configure
        shell: pwsh
        run: |
          # Tests and LTO are not needed to produce the launcher binary and only
          # make the build slower and more fragile.
          cmake --preset windows_msvc -DBUILD_TESTING=OFF -DENABLE_LTO=OFF

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows_msvc --config Release

      - name: Install
        shell: pwsh
        run: |
          # Install to the prefix from the preset (${sourceDir}/install). Do not
          # pass --prefix: launcher/CMakeLists.txt also installs with absolute
          # paths derived from CMAKE_INSTALL_PREFIX.
          cmake --install build --config Release

      - name: Show what was built
        shell: pwsh
        run: Get-ChildItem install -Recurse -File | Select-Object FullName, Length

      - name: Build installer
        shell: pwsh
        env:
          # NScurl lets the installer download the Visual C++ runtime when needed.
          # Pinned so the build is reproducible; verified before use.
          NSCURL_VERSION: "v24.9.26.122"
          NSCURL_SHA256: "AEE6C4BE3CB6455858E9C1EE4B3AFE0DB9960FA03FE99CCDEDC28390D57CCBB0"
        run: |
          New-Item -ItemType Directory -Force NSISPlugins | Out-Null
          Invoke-WebRequest "https://github.com/negrutiu/nsis-nscurl/releases/download/$env:NSCURL_VERSION/NScurl.zip" -OutFile "NSISPlugins/NScurl.zip"
          $hash = (Get-FileHash "NSISPlugins/NScurl.zip" -Algorithm Sha256).Hash
          if ($hash -ne $env:NSCURL_SHA256) {
            throw "NScurl.zip SHA-256 mismatch: $hash"
          }
          Expand-Archive -Path "NSISPlugins/NScurl.zip" -DestinationPath "NSISPlugins/NScurl" -Force

          # install/ is the payload; win_install.nsi references its files relative
          # to the working directory and writes the setup executable to the repo root.
          Push-Location install
          makensis -NOCD "${{ github.workspace }}/build/program_info/win_install.nsi"
          Pop-Location

          if (-not (Test-Path "IAMNXLauncher-Setup.exe")) {
            throw "Installer was not created"
          }
          Get-Item "IAMNXLauncher-Setup.exe" | Select-Object Name, Length

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: iamnxlauncher-windows-x64
          path: install/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: iamnxlauncher-windows-x64-setup
          path: IAMNXLauncher-Setup.exe
          if-no-files-found: error
