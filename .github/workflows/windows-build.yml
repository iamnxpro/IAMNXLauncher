name: windows-release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.*'
          cache: true

      - name: Install vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Configure
        run: cmake --preset windows_msvc -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build --preset windows_msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IAMNXLAUNCHER-exe
          path: build/bin/   
